name: CI

on:
  workflow_dispatch:

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
    cancel-in-progress: true

permissions:
  contents: read

# The jobs below are fastify/workflows/.github/workflows/plugins-ci.yml@v5
# (and the nested-quality.yml it calls) inlined verbatim with
# `license-check: true` / `lint: true`, because a reusable-workflow caller job
# cannot declare `timeout-minutes`.
jobs:
  license-check:
    name: Check Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: lts/*

      - name: Install dependencies
        run: npm i --ignore-scripts

      - name: Check Licenses
        run: npx license-checker --production --summary --onlyAllow="0BSD;Apache-2.0;BlueOak-1.0.0;BSD-2-Clause;BSD-3-Clause;ISC;MIT;"

  linter:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: lts/*

      - name: Install dependencies
        run: npm i --ignore-scripts

      - name: Lint code
        run: npm run lint

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm i --ignore-scripts

      # Same commands as `npm test` (package.json `test:unit` + `test:typescript`),
      # inlined only to raise borp's per-file timeout from its 30s default: the
      # slower macOS runners cancel test/static.test.js mid-run at 30s, which then
      # also drags the coverage gate under its 100% threshold. package.json itself
      # ships inside the published tarball, so the bump cannot live there.
      - name: Run tests
        run: |
          npx borp -C --check-coverage --lines 100 --timeout 180000
          npm run test:typescript

  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: '23'

      # package.json declares no `files` allowlist, so `npm pack` ships `.github/`
      # inside the tarball -- the published static-9.0.0.tgz contains upstream's
      # own ci.yml. Restore that pristine file (upstream tag v9.0.0) before packing
      # so the fork-CI edits above stay out of the artifact.
      - name: Restore upstream ci.yml before packing
        run: |
          git fetch --depth=1 https://github.com/fastify/fastify-static.git 4eec6717e8781f4dc8f5e776d029843f8b86c834
          git checkout FETCH_HEAD -- .github/workflows/ci.yml

      - name: Pack
        run: |
          npm pack
          mv fastify-static-9.0.0.tgz static-9.0.0.tgz

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: static-9.0.0.tgz
          if-no-files-found: error
